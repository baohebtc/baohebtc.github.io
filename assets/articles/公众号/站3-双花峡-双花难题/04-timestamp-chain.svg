<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680">
<rect width="680" height="300" fill="#f4ecd8"/>
<rect x="14" y="14" width="652" height="272" rx="14" fill="none" stroke="#c9a86a" stroke-width="1.2"/>
<text x="340" y="50" fill="#3a2c1a" font-family="sans-serif" font-size="16" font-weight="500" text-anchor="middle">时间戳 + 哈希链：先后次序被锁死</text>
<rect x="60" y="100" width="150" height="90" rx="10" fill="#efe3c8" stroke="#c9a86a" stroke-width="1.2"/>
<text x="135" y="130" fill="#3a2c1a" font-family="sans-serif" font-size="13" font-weight="500" text-anchor="middle">区块 #1</text>
<text x="135" y="152" fill="#6b5a3e" font-family="sans-serif" font-size="10" text-anchor="middle">时间 10:00</text>
<text x="135" y="170" fill="#6b5a3e" font-family="sans-serif" font-size="10" text-anchor="middle">hash: a1b2…</text>
<rect x="265" y="100" width="150" height="90" rx="10" fill="#efe3c8" stroke="#c9a86a" stroke-width="1.2"/>
<text x="340" y="130" fill="#3a2c1a" font-family="sans-serif" font-size="13" font-weight="500" text-anchor="middle">区块 #2</text>
<text x="340" y="152" fill="#6b5a3e" font-family="sans-serif" font-size="10" text-anchor="middle">时间 10:05</text>
<text x="340" y="170" fill="#6b5a3e" font-family="sans-serif" font-size="10" text-anchor="middle">含 #1 的 hash</text>
<rect x="470" y="100" width="150" height="90" rx="10" fill="#efe3c8" stroke="#F7931A" stroke-width="2"/>
<text x="545" y="130" fill="#F7931A" font-family="sans-serif" font-size="13" font-weight="500" text-anchor="middle">区块 #3</text>
<text x="545" y="152" fill="#6b5a3e" font-family="sans-serif" font-size="10" text-anchor="middle">时间 10:10</text>
<text x="545" y="170" fill="#6b5a3e" font-family="sans-serif" font-size="10" text-anchor="middle">含 #2 的 hash</text>
<line x1="210" y1="145" x2="262" y2="145" stroke="#c9a86a" stroke-width="2.5" marker-end="url(#ar4)"/>
<line x1="415" y1="145" x2="467" y2="145" stroke="#c9a86a" stroke-width="2.5" marker-end="url(#ar4)"/>
<text x="340" y="250" fill="#6b5a3e" font-family="sans-serif" font-size="12" text-anchor="middle">每个区块都「咬住」上一个 → 改一个，后面全断</text>
<defs><marker id="ar4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#c9a86a" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
</svg>