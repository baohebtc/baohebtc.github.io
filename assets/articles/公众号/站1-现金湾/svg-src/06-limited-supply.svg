<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3E2723" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="parch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FFECB3"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#3E2723"/></marker>
  </defs>
  <rect width="900" height="420" fill="url(#parch)"/>
  <rect x="30" y="30" width="390" height="350" rx="16" fill="#FFE0B2" stroke="#3E2723" stroke-width="2" filter="url(#shadow)"/>
  <rect x="480" y="30" width="390" height="350" rx="16" fill="#F7931A" stroke="#3E2723" stroke-width="2" filter="url(#shadow)" opacity="0.9"/>

  <text x="225" y="70" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#3E2723" text-anchor="middle">🥇 黄金</text>
  <text x="675" y="70" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#3E2723" text-anchor="middle">₿ 比特币</text>

  <rect x="90" y="110" width="270" height="60" rx="10" fill="#FFF8E1" stroke="#3E2723" stroke-width="1.5"/>
  <text x="225" y="135" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#3E2723" text-anchor="middle">稀缺</text>
  <text x="225" y="155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#3E2723" text-anchor="middle">地壳含量有限</text>

  <rect x="90" y="200" width="270" height="60" rx="10" fill="#FFF8E1" stroke="#3E2723" stroke-width="1.5"/>
  <text x="225" y="225" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#3E2723" text-anchor="middle">新增供应</text>
  <text x="225" y="245" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#3E2723" text-anchor="middle">发现新矿可以再次增加</text>

  <rect x="540" y="110" width="270" height="60" rx="10" fill="#FFF8E1" stroke="#3E2723" stroke-width="1.5"/>
  <text x="675" y="135" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#3E2723" text-anchor="middle">稀缺</text>
  <text x="675" y="155" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#3E2723" text-anchor="middle">代码写死 2100 万枚上限</text>

  <rect x="540" y="200" width="270" height="60" rx="10" fill="#FFF8E1" stroke="#3E2723" stroke-width="1.5"/>
  <text x="675" y="225" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#3E2723" text-anchor="middle">新增供应</text>
  <text x="675" y="245" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#3E2723" text-anchor="middle">约每 4 年减半，直到接近 0</text>

  <rect x="540" y="290" width="270" height="60" rx="10" fill="#FFF8E1" stroke="#3E2723" stroke-width="1.5"/>
  <text x="675" y="315" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#3E2723" text-anchor="middle">上限可改吗？</text>
  <text x="675" y="335" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#3E2723" text-anchor="middle">需全网绝大多数节点同意，极难</text>

  <line x1="420" y1="180" x2="480" y2="180" stroke="#3E2723" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="170" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#3E2723" text-anchor="middle">像但不一样</text>
</svg>
