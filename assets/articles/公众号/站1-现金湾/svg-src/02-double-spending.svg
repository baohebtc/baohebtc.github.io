<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3E2723" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="parch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FFECB3"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#3E2723"/></marker>
  </defs>
  <rect width="900" height="540" fill="url(#parch)"/>
  <rect x="260" y="30" width="380" height="64" rx="12" fill="#F7931A" stroke="#3E2723" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="55" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#3E2723" text-anchor="middle">同一笔数字钱，能复制很多次</text>
  <text x="450" y="78" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#3E2723" text-anchor="middle">怎么防止它被花两次？</text>

  <polygon points="450,120 430,150 470,150" fill="#3E2723"/>
  <rect x="300" y="160" width="300" height="54" rx="12" fill="#FFE0B2" stroke="#3E2723" stroke-width="2"/>
  <text x="450" y="182" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#3E2723" text-anchor="middle">有没有一个中心账本？</text>
  <text x="450" y="203" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#5D4037" text-anchor="middle">Decision · 决策分叉</text>

  <line x1="360" y1="214" x2="200" y2="280" stroke="#3E2723" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="214" x2="700" y2="280" stroke="#3E2723" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="280" width="280" height="110" rx="12" fill="#FFF8E1" stroke="#3E2723" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="305" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#3E2723" text-anchor="middle">有：银行 / 支付宝</text>
  <text x="200" y="330" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#3E2723" text-anchor="middle">中心机构判定谁先花</text>
  <text x="200" y="355" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#5D4037" text-anchor="middle">你信的是：公司</text>

  <rect x="560" y="280" width="280" height="110" rx="12" fill="#F7931A" stroke="#3E2723" stroke-width="2" filter="url(#shadow)" opacity="0.9"/>
  <text x="700" y="305" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#3E2723" text-anchor="middle">无：比特币</text>
  <text x="700" y="330" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#3E2723" text-anchor="middle">全网公开账本 + 时间顺序</text>
  <text x="700" y="355" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#3E2723" text-anchor="middle">你信的是：数学 + 经济激励</text>

  <rect x="560" y="420" width="280" height="70" rx="10" fill="#FFF8E1" stroke="#3E2723" stroke-width="1.5"/>
  <text x="700" y="445" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#3E2723" text-anchor="middle">第一笔交易有效</text>
  <text x="700" y="465" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#3E2723" text-anchor="middle">后续复制自动被拒绝</text>
  <line x1="700" y1="390" x2="700" y2="420" stroke="#3E2723" stroke-width="1.5" stroke-dasharray="4"/>
</svg>
