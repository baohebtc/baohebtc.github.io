<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3E2723" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="parch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FFECB3"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#3E2723"/></marker>
  </defs>
  <rect width="900" height="520" fill="url(#parch)"/>
  <rect x="30" y="30" width="390" height="440" rx="16" fill="#FFE0B2" stroke="#3E2723" stroke-width="2" filter="url(#shadow)"/>
  <rect x="480" y="30" width="390" height="440" rx="16" fill="#F7931A" stroke="#3E2723" stroke-width="2" filter="url(#shadow)" opacity="0.9"/>

  <text x="225" y="70" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#3E2723" text-anchor="middle">🛖 村账</text>
  <text x="225" y="95" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#5D4037" text-anchor="middle">靠人情信任</text>
  <text x="675" y="70" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#3E2723" text-anchor="middle">🌐 比特币账本</text>
  <text x="675" y="95" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#3E2723" text-anchor="middle">靠陌生人也能互信</text>

  <circle cx="100" cy="160" r="24" fill="#FFF8E1" stroke="#3E2723" stroke-width="2"/>
  <text x="100" y="167" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#3E2723" text-anchor="middle">村民A</text>
  <circle cx="350" cy="160" r="24" fill="#FFF8E1" stroke="#3E2723" stroke-width="2"/>
  <text x="350" y="167" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#3E2723" text-anchor="middle">村民B</text>
  <rect x="185" y="140" width="80" height="44" rx="8" fill="#FFF8E1" stroke="#3E2723" stroke-width="2"/>
  <text x="225" y="168" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#3E2723" text-anchor="middle">村长</text>
  <line x1="124" y1="160" x2="185" y2="160" stroke="#3E2723" stroke-width="1.5"/>
  <line x1="265" y1="160" x2="326" y2="160" stroke="#3E2723" stroke-width="1.5"/>

  <rect x="140" y="250" width="170" height="60" rx="10" fill="#FFF8E1" stroke="#3E2723" stroke-width="1.5"/>
  <text x="225" y="275" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#3E2723" text-anchor="middle">大家认村长的本子</text>
  <text x="225" y="295" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#3E2723" text-anchor="middle">赖账靠人情约束</text>
  <line x1="225" y1="230" x2="225" y2="250" stroke="#3E2723" stroke-width="1.5" stroke-dasharray="4"/>

  <g>
    <circle cx="540" cy="160" r="24" fill="#FFF8E1" stroke="#3E2723" stroke-width="2"/>
    <text x="540" y="167" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#3E2723" text-anchor="middle">节点1</text>
    <circle cx="600" cy="160" r="24" fill="#FFF8E1" stroke="#3E2723" stroke-width="2"/>
    <text x="600" y="167" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#3E2723" text-anchor="middle">节点2</text>
    <circle cx="660" cy="160" r="24" fill="#FFF8E1" stroke="#3E2723" stroke-width="2"/>
    <text x="660" y="167" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#3E2723" text-anchor="middle">节点3</text>
    <circle cx="720" cy="160" r="24" fill="#FFF8E1" stroke="#3E2723" stroke-width="2"/>
    <text x="720" y="167" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#3E2723" text-anchor="middle">节点N</text>
    <rect x="610" y="250" width="130" height="50" rx="10" fill="#FFF8E1" stroke="#3E2723" stroke-width="2"/>
    <text x="675" y="272" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#3E2723" text-anchor="middle">规则 + 奖励</text>
    <text x="675" y="290" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#3E2723" text-anchor="middle">让老实记账更划算</text>
    <line x1="560" y1="184" x2="640" y2="250" stroke="#3E2723" stroke-width="1"/>
    <line x1="612" y1="184" x2="650" y2="250" stroke="#3E2723" stroke-width="1"/>
    <line x1="672" y1="184" x2="670" y2="250" stroke="#3E2723" stroke-width="1"/>
    <line x1="732" y1="184" x2="700" y2="250" stroke="#3E2723" stroke-width="1"/>
  </g>

  <rect x="590" y="350" width="170" height="60" rx="10" fill="#FFF8E1" stroke="#3E2723" stroke-width="1.5"/>
  <text x="675" y="375" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#3E2723" text-anchor="middle">人人手里同一本账</text>
  <text x="675" y="395" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#3E2723" text-anchor="middle">谁也改不了已写上的记录</text>
  <line x1="675" y1="300" x2="675" y2="350" stroke="#3E2723" stroke-width="1.5" stroke-dasharray="4"/>

  <line x1="420" y1="250" x2="480" y2="250" stroke="#3E2723" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="240" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#3E2723" text-anchor="middle">升级</text>
</svg>
