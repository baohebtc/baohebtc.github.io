<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3E2723" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="parch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FFECB3"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#3E2723"/></marker>
  </defs>
  <rect width="900" height="420" fill="url(#parch)"/>
  <rect x="60" y="60" width="220" height="80" rx="12" fill="#F7931A" stroke="#3E2723" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="90" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#3E2723" text-anchor="middle">🔑 私钥</text>
  <text x="170" y="115" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#3E2723" text-anchor="middle">唯一能让你花钱的密码</text>

  <rect x="620" y="60" width="220" height="80" rx="12" fill="#FFE0B2" stroke="#3E2723" stroke-width="2" filter="url(#shadow)"/>
  <text x="730" y="90" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#3E2723" text-anchor="middle">📮 公钥 / 地址</text>
  <text x="730" y="115" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#3E2723" text-anchor="middle">可以公开的"门牌号"</text>

  <line x1="280" y1="100" x2="620" y2="100" stroke="#3E2723" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6"/>
  <text x="450" y="85" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#3E2723" text-anchor="middle">数学上：私钥 → 公钥 容易</text>
  <text x="450" y="130" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#3E2723" text-anchor="middle">反推：几乎不可能</text>

  <rect x="170" y="200" width="220" height="60" rx="10" fill="#FFF8E1" stroke="#3E2723" stroke-width="1.5"/>
  <text x="280" y="225" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#3E2723" text-anchor="middle">私钥签名 = 证明所有权</text>
  <text x="280" y="245" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#3E2723" text-anchor="middle">→ 可以花费这笔比特币</text>
  <line x1="170" y1="140" x2="220" y2="200" stroke="#3E2723" stroke-width="1.5"/>

  <rect x="580" y="200" width="220" height="60" rx="10" fill="#FFF8E1" stroke="#3E2723" stroke-width="1.5"/>
  <text x="690" y="225" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#3E2723" text-anchor="middle">别人用地址给你打钱</text>
  <text x="690" y="245" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#3E2723" text-anchor="middle">类似寄快递填门牌号</text>
  <line x1="690" y1="140" x2="690" y2="200" stroke="#3E2723" stroke-width="1.5"/>

  <rect x="320" y="310" width="260" height="70" rx="10" fill="#F7931A" stroke="#3E2723" stroke-width="2" filter="url(#shadow)" opacity="0.9"/>
  <text x="450" y="335" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#3E2723" text-anchor="middle">⚠️ 私钥丢了 = 比特币永久不可动用</text>
  <text x="450" y="358" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#3E2723" text-anchor="middle">没有客服、没有锁匠、没有找回</text>
  <line x1="280" y1="260" x2="380" y2="310" stroke="#3E2723" stroke-width="1.5" stroke-dasharray="4"/>
</svg>
