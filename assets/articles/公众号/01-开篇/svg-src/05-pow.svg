<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3E2723" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="parch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FFECB3"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#3E2723"/></marker>
  </defs>
  <rect width="900" height="360" fill="url(#parch)"/>
  <rect x="40" y="60" width="140" height="70" rx="10" fill="#FFE0B2" stroke="#3E2723" stroke-width="2"/>
  <text x="110" y="85" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#3E2723" text-anchor="middle">新交易</text>
  <text x="110" y="108" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#3E2723" text-anchor="middle">广播到全网</text>

  <line x1="180" y1="95" x2="250" y2="95" stroke="#3E2723" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="250" y="60" width="200" height="70" rx="10" fill="#FFF8E1" stroke="#3E2723" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="85" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#3E2723" text-anchor="middle">矿工竞争</text>
  <text x="350" y="108" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#3E2723" text-anchor="middle">解极难的数学题</text>

  <line x1="450" y1="95" x2="520" y2="95" stroke="#3E2723" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="520" y="60" width="160" height="70" rx="10" fill="#F7931A" stroke="#3E2723" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="85" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#3E2723" text-anchor="middle">第一个解出</text>
  <text x="600" y="108" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#3E2723" text-anchor="middle">获准记账</text>

  <line x1="600" y1="130" x2="600" y2="170" stroke="#3E2723" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="490" y="170" width="220" height="70" rx="10" fill="#FFF8E1" stroke="#3E2723" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="195" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#3E2723" text-anchor="middle">新区块诞生</text>
  <text x="600" y="218" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#3E2723" text-anchor="middle">交易打包 + 新比特币奖励</text>

  <line x1="600" y1="240" x2="600" y2="280" stroke="#3E2723" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="460" y="280" width="280" height="60" rx="10" fill="#F7931A" stroke="#3E2723" stroke-width="2" filter="url(#shadow)" opacity="0.9"/>
  <text x="600" y="305" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#3E2723" text-anchor="middle">篡改需重算后续所有题</text>
  <text x="600" y="325" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#3E2723" text-anchor="middle">成本 &gt; 收益 → 账本安全</text>

  <rect x="720" y="60" width="140" height="70" rx="10" fill="#FFE0B2" stroke="#3E2723" stroke-width="2"/>
  <text x="790" y="85" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#3E2723" text-anchor="middle">结果本身</text>
  <text x="790" y="108" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#3E2723" text-anchor="middle">没有实际用途</text>
  <line x1="680" y1="95" x2="720" y2="95" stroke="#3E2723" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <text x="730" y="135" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5D4037" text-anchor="middle">「浪费」算力 = 安全代价</text>
</svg>
