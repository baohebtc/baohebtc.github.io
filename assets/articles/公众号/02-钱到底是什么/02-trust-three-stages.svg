<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680">
<rect x="0" y="0" width="680" height="300" fill="#f4ecd8"/>
<rect x="14" y="14" width="652" height="272" rx="14" fill="none" stroke="#c9a86a" stroke-width="1.2"/>

<defs><marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#c9a86a" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
<text x="340" y="50" fill="#3a2c1a" font-family="sans-serif" font-size="16" font-weight="500" text-anchor="middle">信任的三次升级</text>
<text x="340" y="78" fill="#6b5a3e" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="middle">从「信人」到「信机构」，再到「信规则」</text>
<rect x="40" y="100" width="160" height="110" rx="12" fill="#efe3c8" stroke="#c9a86a" stroke-width="1.2"/><text x="120" y="138" fill="#3a2c1a" font-family="sans-serif" font-size="15" font-weight="500" text-anchor="middle">认识对方</text><text x="120" y="166" fill="#6b5a3e" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="middle">范围极小</text><text x="120" y="190" fill="#8a7a55" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="middle">兜底：彼此信任</text><line x1="200" y1="155" x2="230" y2="155" stroke="#c9a86a" stroke-width="2" marker-end="url(#ar2)"/><rect x="260" y="100" width="160" height="110" rx="12" fill="#efe3c8" stroke="#c9a86a" stroke-width="1.2"/><text x="340" y="138" fill="#3a2c1a" font-family="sans-serif" font-size="15" font-weight="500" text-anchor="middle">信任机构</text><text x="340" y="166" fill="#6b5a3e" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="middle">范围变大</text><text x="340" y="190" fill="#8a7a55" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="middle">兜底：银行 / 央行</text><line x1="420" y1="155" x2="450" y2="155" stroke="#c9a86a" stroke-width="2" marker-end="url(#ar2)"/><rect x="480" y="100" width="160" height="110" rx="12" fill="#efe3c8" stroke="#F7931A" stroke-width="2"/><text x="560" y="138" fill="#F7931A" font-family="sans-serif" font-size="15" font-weight="500" text-anchor="middle">信任规则</text><text x="560" y="166" fill="#6b5a3e" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="middle">范围最大</text><text x="560" y="190" fill="#8a7a55" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="middle">兜底：数学 / 代码</text>
<text x="340" y="255" fill="#F7931A" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle">比特币想做的：把兜底从机构，换成写死的规则</text>

