<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f0dd"/>
      <stop offset="1" stop-color="#efe2c4"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="300" fill="url(#bg)"/>
  <rect x="14" y="14" width="872" height="272" rx="16" fill="none" stroke="#c9a86a" stroke-width="1.2"/>
  <text x="450" y="52" fill="#3a2c1a" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="18" font-weight="600" text-anchor="middle">本篇三句话带走</text>

  <rect x="30" y="84" width="260" height="186" rx="12" fill="#fff8ea" stroke="#c9a86a" stroke-width="0.9"/>
  <circle cx="160" cy="124" r="22" fill="#3a2c1a"/>
  <text x="160" y="130" fill="#fff" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle">①</text>
  <text x="160" y="176" fill="#3a2c1a" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="15" font-weight="700" text-anchor="middle">钱是约定</text>
  <text x="160" y="204" fill="#5b4a30" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="13" text-anchor="middle">钱不是「东西」，是被一</text>
  <text x="160" y="224" fill="#5b4a30" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="13" text-anchor="middle">群人共同接受的约定</text>

  <rect x="320" y="84" width="260" height="186" rx="12" fill="#fff8ea" stroke="#c9a86a" stroke-width="0.9"/>
  <circle cx="450" cy="124" r="22" fill="#3a2c1a"/>
  <text x="450" y="130" fill="#fff" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle">②</text>
  <text x="450" y="176" fill="#3a2c1a" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="15" font-weight="700" text-anchor="middle">信任三阶段</text>
  <text x="450" y="204" fill="#5b4a30" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="13" text-anchor="middle">信人 → 信机构</text>
  <text x="450" y="224" fill="#5b4a30" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="13" text-anchor="middle">→ 信规则</text>

  <rect x="610" y="84" width="260" height="186" rx="12" fill="#fff8ea" stroke="#c9a86a" stroke-width="0.9"/>
  <circle cx="740" cy="124" r="22" fill="#3a2c1a"/>
  <text x="740" y="130" fill="#fff" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle">③</text>
  <text x="740" y="176" fill="#3a2c1a" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="15" font-weight="700" text-anchor="middle">锚点四迁移</text>
  <text x="740" y="204" fill="#5b4a30" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="13" text-anchor="middle">实物→国家→账户</text>
  <text x="740" y="224" fill="#5b4a30" font-family="'PingFang SC','Heiti SC',sans-serif" font-size="13" text-anchor="middle">→代码（比特币）</text>
</svg>
